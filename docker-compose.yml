version: '3.8'

services:
  # 1. Database
  postgres:
    image: postgres:15-alpine
    container_name: iams_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-assetdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - iams_network

  # 2. MinIO (Object Storage)
  minio:
    image: minio/minio:latest
    container_name: iams_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - iams_network

  # 3. Backend (Node.js API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iams_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-assetdb}?schema=public
      - JWT_SECRET=${JWT_SECRET:-mysecretkey}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-password123}
      - MINIO_BUCKET=assets
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - minio
    networks:
      - iams_network

  # 4. Frontend (Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iams_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - iams_network

volumes:
  postgres_data:
  minio_data:

networks:
  iams_network:
    driver: bridge
